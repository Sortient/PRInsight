<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review Feedback Generator</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Pull Request Comment Sentiment Analysis</h1>
    <form method="post">
        <label for="repo_name">Repository Name (e.g., username/repo):</label>
        <input type="text" name="repo_name" required>
        <button type="submit">Analyze Comments</button>
    </form>
    
    <div id="feedback">
        {% if feedback %}
            <h2>Sentiment Analysis Results</h2>
            {{ feedback | safe }}
        {% endif %}
    </div>
</body>
</html>
